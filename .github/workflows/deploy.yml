name: Deploy

# A version tag is what makes a commit a release. Pushing v1.2.3 deploys it;
# an ordinary push to a branch deploys nothing, ever. The manual trigger stays
# for redeploying without cutting a new tag.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A tag that disagrees with the plugin header would put the wrong
      # version live without saying so. Both places the version is written
      # have to match the tag before anything is copied.
      - name: Check the tag against the plugin version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header="$(grep -m1 -E '^[[:space:]]*\*[[:space:]]*Version:' tbt-homework.php | awk '{print $NF}')"
          constant="$(grep -m1 -E "define\( 'TBT_HOMEWORK_VERSION'" tbt-homework.php | sed -E "s/.*'([^']*)' *\);.*/\1/")"

          if [ "$tag" != "$header" ] || [ "$tag" != "$constant" ]; then
            echo "Tag $GITHUB_REF_NAME says $tag, the header says $header, TBT_HOMEWORK_VERSION says $constant." >&2
            echo "Nothing deployed. Make the three agree and tag again." >&2
            exit 1
          fi

          echo "Deploying $header from tag $GITHUB_REF_NAME."

      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          server-dir: /tbt-homework/
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            node_modules/**
            **/*.md
            docs/**
            tests/**
